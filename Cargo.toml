[package]
name = "k9x"
version = "0.2.0"
edition = "2024"
authors = ["Sudheeshkumar Surendran <sudhikumar-work>"]
description = "Ultra-fast, event-driven Kubernetes TUI and agent CLI"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/sudhikumar-work/k9x"
homepage = "https://github.com/sudhikumar-work/k9x"
keywords = ["kubernetes", "k8s", "tui", "cli", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dev-dependencies]
tempfile = "3.10"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
flate2 = "1.1.9"
futures = "0.3.34"
http = "1.5.0"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "ws", "rustls-tls"] }
ratatui = "0.30.2"
serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1", features = ["full"] }
toml = "1.1.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"

